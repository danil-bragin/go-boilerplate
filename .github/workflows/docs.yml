# Renders the public API contracts into a static docs bundle on every push to
# main that touches a spec. By default the bundle is uploaded as a workflow
# artifact (always succeeds, downloadable from the run page). To serve it from
# GitHub Pages instead, enable Pages (repo Settings → Pages → Source: "GitHub
# Actions") and uncomment the `deploy` job below — the actions are already
# SHA-pinned.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "examples/gateway/openapi.yaml"
      - "proto/**"
      - "docs/errors.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Render OpenAPI → Redoc HTML + collect contracts
        run: |
          set -euo pipefail
          mkdir -p site/proto
          # Redoc static bundle of the REST edge contract (self-contained HTML).
          npx --yes @redocly/cli@1 build-docs examples/gateway/openapi.yaml \
            --output site/index.html
          # Ship the raw machine-readable contracts alongside the rendered docs.
          cp examples/gateway/openapi.yaml site/openapi.yaml
          cp docs/errors.md site/errors.md
          find proto -name '*.proto' -exec cp {} site/proto/ \;

      - name: Upload docs artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-docs
          path: site
          if-no-files-found: error


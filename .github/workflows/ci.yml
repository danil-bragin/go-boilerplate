name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      # Build golangci-lint from source with the repo's Go toolchain: the
      # prebuilt release binaries are built with Go 1.25 and cannot read
      # Go 1.26 stdlib export data ("file requires newer Go version").
      # Switch back to golangci/golangci-lint-action once a 1.26-built
      # release ships.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./...

  # ── Buf proto lint ────────────────────────────────────────────────────────
  buf:
    name: Buf lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0   # needed for buf breaking --against

      - uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          setup_only: true

      - name: buf lint
        run: buf lint

      # Breaking-change detection. BLOCKING: a contract break fails CI. If a
      # break is intentional, coordinate the version bump (new vN proto
      # package) instead of weakening this gate.
      #
      # Baseline: PRs compare against origin/main — comparing against HEAD~1
      # on a multi-commit PR would only catch breaks introduced by the last
      # commit and miss the rest. Pushes to main keep the HEAD~1 baseline
      # (each push is validated against the previous main state).
      - name: buf breaking
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            buf breaking --against '.git#ref=origin/main'
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            buf breaking --against '.git#ref=HEAD~1'
          else
            echo "no parent commit (bootstrap) — skipping breaking check"
          fi


  # ── SQL migration lint (squawk) ───────────────────────────────────────────
  # BLOCKING: squawk catches dangerous DDL (table rewrites, lock-heavy ALTERs,
  # non-concurrent index builds on hot tables). Config: .squawk.toml.
  sql-lint:
    name: SQL lint (squawk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      # The pinned sha256 was computed from the v2.57.0 release asset (the
      # release publishes no checksum file); bump it together with the URL.
      - name: Download squawk
        run: |
          curl -sSfL -o /usr/local/bin/squawk \
            https://github.com/sbdchd/squawk/releases/download/v2.57.0/squawk-linux-x64
          echo "408d013a1561133ddf30240b4d53be2d29704b50530970ab7fffa5d73e14b040  /usr/local/bin/squawk" | sha256sum -c -
          chmod +x /usr/local/bin/squawk
          squawk --version

      - name: squawk lint migrations
        run: squawk -c .squawk.toml $(git ls-files '*/migrations/*.sql' '*/migrations/sql/*.sql')

  # ── Prometheus rules + config validation (promtool) ──────────────────────
  # BLOCKING: checks all rule files, the scrape config, and runs the rule
  # unit tests (SLO burn-rate arithmetic incl. the total-outage scenarios)
  # against the same prom/prometheus image the compose stack pins.
  # Keep in sync with the `just promtool` recipe (justfile).
  promtool:
    name: Promtool (rules + config + rule tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/r:ro" --entrypoint promtool prom/prometheus:v3.12.0 \
            check rules /r/rules.yaml /r/rules-latency.yaml /r/slo.yaml

      - name: promtool check config
        run: |
          docker run --rm \
            -v "$PWD/deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/deploy/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro" \
            -v "$PWD/deploy/prometheus/rules-latency.yaml:/etc/prometheus/rules-latency.yaml:ro" \
            -v "$PWD/deploy/prometheus/slo.yaml:/etc/prometheus/slo.yaml:ro" \
            --entrypoint promtool prom/prometheus:v3.12.0 \
            check config /etc/prometheus/prometheus.yml

      - name: promtool test rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/r:ro" --entrypoint promtool prom/prometheus:v3.12.0 \
            test rules /r/tests/slo_test.yaml

  # ── Vulnerability scan ────────────────────────────────────────────────────
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: Install govulncheck
        # Pinned (was @latest). govulncheck's exit code propagates: a known
        # vulnerability in reachable code fails this step, which fails the job
        # (no continue-on-error) — the gate is blocking.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

  # ── Secret scan (gitleaks) ────────────────────────────────────────────────
  # BLOCKING: scans the FULL git history (fetch-depth 0) — a secret committed
  # and later "removed" is still live until rotated, so the tip alone is not
  # enough. Action pinned by commit sha (supply-chain hygiene for an action
  # that reads the whole repo history).
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0   # full history, not just the checked-out tip

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          # NOTE: organization-owned repos additionally require a (free for
          # OSS) GITLEAKS_LICENSE secret — without it this job fails on the
          # first org push. Personal repos need only GITHUB_TOKEN.
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Dependency review (PRs only) ──────────────────────────────────────────
  # Flags newly-introduced vulnerable dependencies (and license problems) in
  # the PR's dependency diff. PR-only by nature: the action diffs base..head
  # through the GitHub dependency-graph API, so it cannot run on push — the
  # `if` skips it there. DORMANT until this repo lives on a GitHub remote and
  # receives pull requests; it costs nothing meanwhile.
  dependency-review:
    name: Dependency review (PRs only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # ── Fast unit-test lane ───────────────────────────────────────────────────
  # Runs only tests that honour testing.Short() — no containers, completes
  # in seconds. Gives fast PR feedback before the slow integration suite.
  unit:
    name: Unit tests (fast lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: go test -short
        run: go test -short -race -timeout 2m ./...

      # Scaffolding smoke: new-service generates a buildable service and
      # rename-module --check produces a sane dry-run plan without writing.
      - name: scaffold smoke (new-service + rename-module)
        run: ./scripts/test-scaffold.sh

      # Doc drift gate (BLOCKING): every Go code block in
      # docs/adding-a-service.md must compile (or at least parse, for blocks
      # marked nocompile) against the current platform API.
      - name: doc-test (adding-a-service.md code blocks)
        run: ./scripts/doc-test.sh

      # Error-registry drift gate (BLOCKING): docs/errors.md is generated
      # from the live apperr registry (cmd/errgen). Adding/changing a code
      # without running `just errgen` fails here instead of silently
      # drifting the documented contract.
      - name: errgen (docs/errors.md in sync)
        run: |
          go run ./cmd/errgen
          git diff --exit-code docs/errors.md

  # ── Integration tests ─────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest   # ubuntu-latest ships with Docker; testcontainers work out of the box
    timeout-minutes: 30      # serial (-p 1) integration suite needs headroom; see the go test note below
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true          # caches both the module download cache and the build cache

      # Verify the module graph compiles cleanly before running the (slow) test suite.
      - name: go build
        run: go build ./...

      # NOTE: Integration tests use testcontainers-go and spin up real Postgres,
      # Redpanda, Redis, and SeaweedFS containers. Docker is available on
      # ubuntu-latest runners so no extra setup is needed.
      #
      # -p 1 (serial package execution) is REQUIRED here: ubuntu-latest runners
      # have only 4 vCPUs, and go test's default package parallelism runs
      # several container-heavy packages at once, oversubscribing the Docker
      # daemon. The symptom is containers being CPU/memory-starved and test
      # binaries dying with exit code 133 — not a real test failure. Serial
      # execution is slower but deterministic; the 25m go-test timeout (and
      # the 30m job timeout above) accounts for it.
      - name: go test
        run: go test -race -p 1 -timeout 25m ./...

  # ── Fuzz smoke (non-blocking) ─────────────────────────────────────────────
  # 30s per target over the attacker-facing parsers (client-IP/XFF extraction,
  # JSON body decode, retry headers, pagination cursor). Non-blocking: fuzzing
  # is probabilistic — a new finding should open an issue (with the corpus
  # file from testdata/fuzz/ in the job log), not flake every PR red.
  # Reproduce/extend locally: `just fuzz [fuzztime]`.
  fuzz:
    name: Fuzz (non-blocking, 30s/target)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: FuzzClientIPKey
        run: go test -fuzz=FuzzClientIPKey -fuzztime=30s -run='^$' ./platform/web/httpserver

      - name: FuzzHTTPXDecode
        run: go test -fuzz=FuzzHTTPXDecode -fuzztime=30s -run='^$' ./platform/web/httpx

      - name: FuzzParseRetryHeaders
        run: go test -fuzz=FuzzParseRetryHeaders -fuzztime=30s -run='^$' ./platform/messaging/retry

      - name: FuzzCursorDecode
        run: go test -fuzz=FuzzCursorDecode -fuzztime=30s -run='^$' ./examples/gateway/internal/app

  # ── gofumpt format gate ───────────────────────────────────────────────────
  # Fails if any non-generated Go file is not formatted with gofumpt.
  # Generated files (gen/, *.pb.go, *_mock.go) are excluded.
  # Uses `go run` to avoid a separate install step — no pinned binary needed.
  format:
    name: Format (gofumpt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26"
          cache: true

      - name: Check gofumpt formatting
        run: |
          # Exclude generated files by their standard "// Code generated ... DO NOT EDIT." header
          # (covers gen/*.pb.go, *_mock.go, oapi gen.go, sqlc output) rather than fragile path globs.
          # gofumpt pinned to v0.10.0 (was @latest) so the format gate is
          # reproducible — a gofumpt release that changes formatting rules
          # can't silently turn this gate red on an unrelated PR.
          src=$(git ls-files '*.go' | xargs grep -L '^// Code generated')
          unformatted=$(go run mvdan.cc/gofumpt@v0.10.0 -l $src)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofumpt:"
            echo "$unformatted"
            echo ""
            echo "Run: go run mvdan.cc/gofumpt@v0.10.0 -w <files>"
            exit 1
          fi

  # ── Image builds + SBOM + vuln scan ──────────────────────────────────────
  build-images:
    name: Build image (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # id-token: write is required for keyless cosign signing (OIDC).
      # Uncomment when the cosign sign step below is enabled.
      # id-token: write
      # security-events: write is required to upload SARIF to GitHub Security tab.
      security-events: write
    strategy:
      matrix:
        service: [gateway, orders, payments, notifications]
      fail-fast: false  # build all images even if one fails
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      # Build without pushing — confirms the parametric Dockerfile resolves for
      # every service.  No registry credentials needed.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            -t ${{ matrix.service }}:ci \
            .

      # ── Trivy: image vulnerability scan ──────────────────────────────────
      # Scans the just-built image for OS + library CVEs.
      # BLOCKING on HIGH/CRITICAL fixable findings (ignore-unfixed: true keeps
      # unfixable base-image CVEs from wedging CI).
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:ci"
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      # ── Trivy: SBOM generation ────────────────────────────────────────────
      # Generates a CycloneDX SBOM for the image and uploads it as an artifact.
      - name: Generate SBOM (Trivy CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:ci"
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json
          retention-days: 90

      # ── Cosign: keyless image signing (OIDC) ─────────────────────────────
      # This step is commented out because it requires:
      #   1. A container registry to push to (IMAGE_REF must be a registry ref).
      #   2. `id-token: write` permission (uncomment above).
      # To enable: push the image to a registry in the Build step, uncomment
      # this step, and uncomment `id-token: write` in permissions above.
      #
      # - name: Install cosign
      #   if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      #   uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
      # - name: cosign sign (keyless/OIDC)
      #   if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
      #   run: |
      #     cosign sign --yes \
      #       ${{ secrets.REGISTRY }}/${{ matrix.service }}:${{ github.sha }}

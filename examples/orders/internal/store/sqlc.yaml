version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "../migrations/sql"
    gen:
      go:
        package: "gen"
        out: "gen"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          # NUMERIC money columns surface as decimal strings; platform/money
          # converts (AmountValue on write, ScanRow on read) — no float leak.
          - db_type: "pg_catalog.numeric"
            go_type: "string"

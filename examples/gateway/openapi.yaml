openapi: "3.0.3"
info:
  title: Gateway API
  description: >
    HTTP edge gateway for the order choreography demo. All API resources are
    versioned under /v1. Errors use RFC 7807 problem+json. Endpoints require a
    bearer token (JWT) unless explicitly marked otherwise.
  version: "1.0.0"

security:
  - bearerAuth: []

paths:
  /v1/orders:
    post:
      summary: Create a new order
      description: >
        Accepts an order creation request, persists a "pending" row in the
        read model, publishes a CreateOrderCommand, and returns 202 with the
        assigned order ID. The order becomes "created" once the orders service
        processes the command, and "paid" after payment — poll the Location
        URL to observe progress.
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >
            Client-chosen key making the request retry-safe: the order id is
            derived deterministically (UUIDv5) from this key, so retries with
            the same key return the same order id and downstream consumers
            deduplicate the command. Omit for a fresh id per request.

            Scope: keys are namespaced per authenticated principal (token
            subject) — two clients may use the same key without colliding.
            When the gateway runs with auth disabled there is no principal to
            scope by, so keys share one global namespace and are only
            collision-safe between cooperating clients.

            Reuse: replaying a key with a DIFFERENT request body (customer_id,
            amount_cents or currency changed) is rejected with 409 Conflict —
            a key identifies one logical request, not a slot to overwrite.
            Mismatch detection reads a replica when one is configured: a reuse
            with a different body within the replication-lag window may return
            202 instead of 409 — the conflicting request is still discarded
            downstream (commands deduplicate by order id); only the 409 signal
            is lost within that window.
            Note that order ids are derived deterministically from the
            (principal, key) pair — key alone when auth is disabled — so they
            are predictable to whoever knows both; treat keys as secrets
            shared only between the client and the gateway.
          schema:
            type: string
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "202":
          description: Order accepted for asynchronous processing.
          headers:
            Location:
              description: URL of the created order resource (initially status "pending").
              schema:
                type: string
              required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

    get:
      summary: List orders
      description: >
        Returns orders from the read model, newest first, using cursor
        (keyset) pagination over (created_at, order_id). Pass the next_cursor
        value from the previous page to fetch the following page; an empty
        next_cursor means the listing is exhausted.

        Ownership: non-admin callers see only orders whose customer_id equals
        their token subject; callers with the admin role see all orders.
        (With auth disabled there is no principal, so the listing is
        unscoped.)
      operationId: listOrders
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor returned by a previous page.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Page size (default 20, maximum 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: One page of orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders/{id}:
    get:
      summary: Get order by ID
      description: >
        Returns the current view of an order from the read model projection.
        Status lifecycle: pending → created → paid | payment_failed | payment_timeout.

        Ownership: non-admin callers may only read orders whose customer_id
        equals their token subject; any other existing order returns the same
        404 as a nonexistent one (no existence oracle). Callers with the
        admin role may read any order.
      operationId: getOrder
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the order.
          schema:
            type: string
      responses:
        "200":
          description: Order found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/orders/{id}/events:
    get:
      summary: Stream order status changes (Server-Sent Events)
      description: >
        Long-lived `text/event-stream` response pushing the order's status
        lifecycle (pending → created → paid | payment_failed |
        payment_timeout) as it changes. The current status is sent
        immediately on connect; each subsequent event is emitted when the
        read-model projection applies a change. Event `id` is the monotone
        status ordinal (pending=0, created=1, terminal=2) and `data` is
        `{"status":"<status>"}`. A comment line (`: hb`) is written every 15
        seconds as a keep-alive. On reconnect, send the standard
        `Last-Event-ID` header: the current status is replayed only when it
        is NEWER than the id you already saw.

        Ownership matches GET /v1/orders/{id}: non-admin callers may only
        stream orders whose customer_id equals their token subject; foreign
        and nonexistent orders return the same 404.

        NOTE: this endpoint is implemented as a hand-mounted streaming
        handler — it is excluded from code generation (see
        x-oapi-codegen-exclude) because the generated strict-handler model
        cannot represent an unbounded event stream.
      operationId: streamOrderEvents
      x-oapi-codegen-exclude: true
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the order.
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: Status ordinal of the last event received (SSE reconnect).
          schema:
            type: string
      responses:
        "200":
          description: >
            Event stream. Each event's data payload carries the order status.
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  id: 1
                  data: {"status":"created"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /healthz:
    get:
      summary: Health check
      description: >
        Returns 200 when the gateway is healthy. Unversioned and
        unauthenticated by design: it is an infrastructure endpoint for load
        balancers, not an API resource.
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: OK

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token (e.g. issued by Keycloak).

  responses:
    BadRequest:
      description: Malformed request (invalid JSON, missing fields, bad parameters).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, malformed, or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not allowed to perform this operation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: >
        Idempotency-Key reused with a different request body. Replay the
        original request unchanged, or pick a new key for the new request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: >
        Rate limit exceeded. Retry-After indicates when to retry.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: >
        Temporarily unable to serve the request: either the per-request
        timeout elapsed (http.TimeoutHandler) or the distributed rate
        limiter is configured fail-closed and its backend is unreachable.
        Safe to retry after a short backoff. The body is RFC 7807-shaped;
        on the timeout path the Content-Type header is sniffed by net/http
        rather than set to application/problem+json (stdlib limitation).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: >
        RFC 9457 problem details. The machine-readable API contract is the
        extension pair (code, params): clients switch on code and read
        params; title and detail are human-readable, may be localized via
        Accept-Language, and must not be parsed.
      required:
        - title
        - status
      properties:
        type:
          type: string
          description: URI reference identifying the problem type.
          default: "about:blank"
        title:
          type: string
          description: Short, human-readable summary of the problem type.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: URI reference identifying this specific occurrence.
        code:
          type: string
          description: >
            Flat UPPER_SNAKE application error code (e.g.
            "GATEWAY_ORDER_NOT_FOUND", "VALIDATION_FAILED"). Stable contract;
            never localized. See docs/errors.md for the registry.
        params:
          type: object
          additionalProperties: true
          description: >
            Structured parameters of the error. Every variable referenced by
            the human-readable message appears here so clients can render
            their own messages (e.g. {"order_id": "..."} for
            GATEWAY_ORDER_NOT_FOUND, {"fields": [{field, rule, param}]} for
            VALIDATION_FAILED).

    CreateOrderRequest:
      type: object
      description: >
        Request body for creating a new order. Constraints are enforced at
        the gateway edge BEFORE the command is produced (violations yield a
        400 problem+json with code VALIDATION_FAILED and per-field
        params.fields entries); the orders consumer revalidates as defense
        in depth.
      required:
        - customer_id
        - amount_cents
        - currency
      properties:
        customer_id:
          type: string
          minLength: 1
          maxLength: 128
          description: The identifier of the customer placing the order.
        amount_cents:
          type: integer
          format: int64
          minimum: 1
          description: >
            The total order amount expressed in the smallest currency unit.
            Must be positive.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: >
            The ISO 4217 currency code (e.g. "USD"), uppercase. The gateway
            additionally checks the code against its supported-currency
            allowlist (see the service documentation); unsupported codes are
            rejected with rule "iso4217".

    CreateOrderResponse:
      type: object
      description: Response body returned when an order is accepted.
      required:
        - order_id
      properties:
        order_id:
          type: string
          description: The unique identifier assigned to the new order.

    OrderView:
      type: object
      description: Read model view of an order, built from event projections.
      required:
        - order_id
        - status
        - amount_cents
        - currency
      properties:
        order_id:
          type: string
          description: The unique identifier of the order.
        status:
          type: string
          description: The current status of the order ("pending", "created", "paid", "payment_failed", "payment_timeout").
        amount_cents:
          type: integer
          format: int64
          description: The total order amount expressed in the smallest currency unit.
        currency:
          type: string
          description: The ISO 4217 currency code (e.g. "USD").

    OrderList:
      type: object
      description: One cursor-paginated page of orders, newest first.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderView"
        next_cursor:
          type: string
          description: >
            Cursor for the next page. Absent or empty when there are no more
            results. Treat as opaque.

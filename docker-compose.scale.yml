# =============================================================================
# SCALE OVERLAY — Tier-1 scalability levers for the compose dev stack.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#     --profile pgbouncer --profile apps up -d
#
# Every lever here already exists in the codebase; this overlay just flips them
# ON together so the effect is observable locally. None of it is a code change.
# See docs/operations.md § "Scaling — Tier-1 levers" for the rationale and the
# signals that tell you when to reach for each one.
#
# Migrations run as the `app` role (PG_MIGRATE_URL below dials Postgres directly
# as app, bypassing PgBouncer's transaction pooling which the migration advisory
# lock needs). app therefore OWNS every service table; the audit append-only
# migration SET LOCAL ROLE audit_admin for the ownership-transfer grants/revokes
# (app is a member of audit_admin). A fresh `up-scale` boots clean out of the box
# — no manual grants needed (this was a real bug, now fixed in the audit
# migrations + init.sql's audit_admin schema CREATE).
#
# What it turns on:
#   1. Connection pooling — apps connect through PgBouncer (transaction mode)
#      instead of straight to Postgres, so a small per-pod pool fans out to many
#      more effective server connections. Pair with a SMALL PG_MAX_CONNS.
#   2. Reader/writer split — PG_READER_DSN routes pg.FromContextRead queries to a
#      replica. Locally it points back at the same Postgres (demonstrates the
#      wiring); in production point it at a real read replica / Aurora reader.
#   3. Partitioned outbox (ADR-0016) — OUTBOX_PARTITION_MODE=partitioned wires
#      the maintenance worker (DETACH+DROP instead of DELETE churn). Demo-sized
#      interval/retention so rotation is visible; use the 720h/2160h defaults in
#      production.
#   4. Relay throughput — bigger batches + tighter poll lower publish lag.
#   5. More Kafka partitions — TOPIC_PARTITIONS raises consumer parallelism.
#      NOTE: EnsureTopics is idempotent and never RE-partitions an existing
#      topic, so wipe the redpanda volume (or bump partitions via rpk) for this
#      to take effect on already-created topics.
# =============================================================================

services:
  gateway:
    environment:
      # 1+2: write through PgBouncer, reads off the (here co-located) reader DSN.
      PG_DSN: postgres://app:app@pgbouncer:5432/gateway?sslmode=disable
      # Migrations dial Postgres DIRECTLY (never through PgBouncer — the migration
      # runner holds a session advisory lock that transaction pooling breaks).
      PG_MIGRATE_URL: postgres://app:app@postgres:5432/gateway?sslmode=disable
      PG_STATEMENT_CACHE_MODE: "1" # describe-exec (prepared plans don't survive txn pooling)
      PG_READER_DSN: postgres://app:app@postgres:5432/gateway?sslmode=disable
      PG_MAX_CONNS: "10" # small per-pod pool; PgBouncer multiplexes upstream
      PG_READER_MAX_CONNS: "10"
      # 5: more partitions = more parallel consumers across replicas.
      TOPIC_PARTITIONS: "24"
      # 6: sharded audit hash chain — drop the global chain-head lock (ADR-0018).
      AUDIT_CHAIN_SHARDS: "4"
      # Load-test: lift the edge rate limiters so the measurement hits the
      # write-path, not the limiter (per-IP + authed-per-principal both raised;
      # authed tier disabled). Production keeps the base-compose limits.
      RATELIMIT_RPS: "1000000"
      RATELIMIT_BURST: "1000000"
      RATELIMIT_AUTHED_RPS: "0"
      # Load-test only: no auth so the open-loop generator + verify probes are not
      # gated by a short-lived Keycloak token (token expiry produced false
      # "never observed" verify failures). APP_ENV=development permits this.
      GATEWAY_AUTH_DISABLED: "true"

  orders:
    environment:
      PG_DSN: postgres://app:app@pgbouncer:5432/orders?sslmode=disable
      PG_MIGRATE_URL: postgres://app:app@postgres:5432/orders?sslmode=disable
      PG_STATEMENT_CACHE_MODE: "1"
      PG_READER_DSN: postgres://app:app@postgres:5432/orders?sslmode=disable
      PG_MAX_CONNS: "10"
      PG_READER_MAX_CONNS: "10"
      TOPIC_PARTITIONS: "24"
      # 3: partitioned outbox retention (demo-sized; prod = 720h/2160h).
      OUTBOX_PARTITION_MODE: partitioned
      OUTBOX_PARTITION_INTERVAL: 24h
      OUTBOX_PARTITION_RETENTION: 72h
      OUTBOX_PARTITION_LOOKAHEAD: "2"
      # 4: relay throughput — bigger batches + tighter poll + sharded publish
      # (ADR-0017: ordered parallel publish across N shard-leaders).
      OUTBOX_BATCH_SIZE: "500"
      OUTBOX_POLL_INTERVAL: 100ms
      OUTBOX_RELAY_SHARDS: "4"
      AUDIT_CHAIN_SHARDS: "4"

  payments:
    environment:
      PG_DSN: postgres://app:app@pgbouncer:5432/payments?sslmode=disable
      PG_MIGRATE_URL: postgres://app:app@postgres:5432/payments?sslmode=disable
      PG_STATEMENT_CACHE_MODE: "1"
      PG_READER_DSN: postgres://app:app@postgres:5432/payments?sslmode=disable
      PG_MAX_CONNS: "10"
      PG_READER_MAX_CONNS: "10"
      TOPIC_PARTITIONS: "24"
      OUTBOX_PARTITION_MODE: partitioned
      OUTBOX_PARTITION_INTERVAL: 24h
      OUTBOX_PARTITION_RETENTION: 72h
      OUTBOX_PARTITION_LOOKAHEAD: "2"
      OUTBOX_BATCH_SIZE: "500"
      OUTBOX_POLL_INTERVAL: 100ms
      OUTBOX_RELAY_SHARDS: "4"
      AUDIT_CHAIN_SHARDS: "4"

  notifications:
    environment:
      # Terminal consumer (no outbox); still benefits from pooling + parallelism.
      PG_DSN: postgres://app:app@pgbouncer:5432/notifications?sslmode=disable
      PG_MIGRATE_URL: postgres://app:app@postgres:5432/notifications?sslmode=disable
      PG_STATEMENT_CACHE_MODE: "1"
      PG_MAX_CONNS: "10"
      TOPIC_PARTITIONS: "24"

# Git hooks for go-boilerplate. Install once: `just hooks` (lefthook install).
pre-commit:
  parallel: false
  commands:
    fmt:
      glob: "*.go"
      # Tool versions pinned to match CI's format gate (gofumpt v0.10.0) and
      # the gen lane — keeps local pre-commit formatting identical to CI.
      run: go run mvdan.cc/gofumpt@v0.10.0 -w {staged_files} && go run golang.org/x/tools/cmd/goimports@v0.46.0 -w -local go-boilerplate {staged_files}
      stage_fixed: true
    lint:
      glob: "*.go"
      run: golangci-lint run ./...
    build:
      run: go build ./...
pre-push:
  commands:
    test:
      run: go test -short ./...

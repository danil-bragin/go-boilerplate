# Squawk (Postgres migration linter) — targeted config for this repo.
#
# goose wraps every migration in a transaction unless the file opts out with
# `-- +goose NO TRANSACTION` (required for CREATE INDEX CONCURRENTLY — see
# platform/storage/pg.Migrate docs), so robustness rules that assume
# auto-commit scripts are evaluated in-transaction.
assume_in_transaction = true

excluded_rules = [
    # Down migrations legitimately drop the objects their Up created.
    "ban-drop-table",
    "ban-drop-column",
    # Boilerplate migrations create indexes together with their (empty)
    # tables, where plain CREATE INDEX is correct and transactional. For
    # populated production tables use CONCURRENTLY + `-- +goose NO TRANSACTION`
    # (documented in pg.Migrate / docs/operations.md).
    "require-concurrent-index-creation",
    "require-concurrent-index-deletion",
    # Lock/statement timeouts are managed by the migration runner environment,
    # not per-file SET statements (pg.Migrate dials a dedicated connection).
    "require-timeout-settings",
    # Existing applied migrations use bigserial; rewriting applied migration
    # files breaks checksum-tracking deployments. New migrations SHOULD use
    # `bigint generated by default as identity`.
    "prefer-identity",
]

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Ingest Prometheus NATIVE histograms (the apps emit OTel exponential
  # histograms; the collector's prometheus exporter — and the apps' own
  # /metrics endpoints — expose them as native histograms over the protobuf
  # scrape format). Setting this also flips the scrape-protocol negotiation
  # order to prefer PrometheusProto (Prometheus ≥3.8). Classic-bucket
  # fallback: TELEMETRY_CLASSIC_HISTOGRAMS=true on the apps — no Prometheus
  # change needed, explicit *_bucket series ingest either way.
  scrape_native_histograms: true

# Alerting rules — compose mounts deploy/prometheus/rules.yaml at this path.
rule_files:
  - /etc/prometheus/rules.yaml

scrape_configs:
  # Scrape Prometheus itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape the OTel Collector's Prometheus exporter.
  # This is the primary metrics source — app services export via OTLP to the
  # collector which exposes an aggregated /metrics endpoint on :8889.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Pyroscope (optional metrics scrape).
  - job_name: pyroscope
    static_configs:
      - targets: ["pyroscope:4040"]

  # App admin servers (/metrics on :9090, compose-internal). Secondary to the
  # collector path above; primarily provides the `up` series that the
  # ServiceFlapping alert (deploy/prometheus/rules.yaml) watches. Targets are
  # down (not flapping) when the `apps` compose profile is not running.
  # This lane also serves NATIVE histograms: the OTel Go prometheus exporter
  # converts exponential histograms to client_golang native histograms, which
  # the protobuf scrape (scrape_native_histograms above) ingests — verified
  # live against otel/exporters/prometheus v0.66 + Prometheus v3.12.0. Note
  # these series carry NO otel_ namespace (e.g. http_server_duration_milliseconds).
  - job_name: apps
    static_configs:
      - targets:
          - gateway:9090
          - orders:9090
          - payments:9090
          - notifications:9090

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Scrape Prometheus itself.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Scrape the OTel Collector's Prometheus exporter.
  # This is the primary metrics source — app services export via OTLP to the
  # collector which exposes an aggregated /metrics endpoint on :8889.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Pyroscope (optional metrics scrape).
  - job_name: pyroscope
    static_configs:
      - targets: ["pyroscope:4040"]

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

extensions:
  # Liveness endpoint the compose healthcheck probes (wget on :13133).
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  # `otlp_grpc` is the v0.153 name of the core OTLP gRPC exporter (the old
  # `otlp` type is a deprecated alias — `components` no longer lists it).
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Exposes OTLP metrics for the Prometheus scrape on :8889. Since contrib
  # v0.153 exponential histograms are converted to Prometheus NATIVE
  # histograms automatically and served via the protobuf exposition format —
  # the scraper must negotiate protobuf and enable native ingestion
  # (deploy/prometheus.yml sets `scrape_native_histograms: true`).
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: otel

  debug:
    verbosity: normal

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]

    # Logs arrive only from services started with TELEMETRY_LOGS=true (the
    # opt-in otlploggrpc exporter + otelslog bridge; stdout logging is
    # unaffected). `debug` prints them on the collector's stdout — swap in /
    # add a real backend exporter (e.g. `loki` or `otlphttp` toward
    # Loki/Elastic) when one joins the compose stack.
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]

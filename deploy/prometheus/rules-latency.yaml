# Latency-tail recording rules — per-signal p50/p95/p99 over 5m windows.
#
# All duration metrics are Prometheus NATIVE histograms (apps emit OTel
# exponential histograms; see docs/operations.md §Latency tails). Native
# syntax: histogram_quantile() takes the rate of the histogram series
# DIRECTLY — there is no `le` label and no `_bucket` suffix to aggregate
# over. The classic fallback (TELEMETRY_CLASSIC_HISTOGRAMS=true) produces
# `<metric>_bucket` series instead, which these rules deliberately do NOT
# cover — fallback environments should adapt the expressions to
# `sum by (le, ...) (rate(<metric>_bucket[5m]))`.
#
# Metric names are the collector-exported ones (`otel` namespace + unit
# suffix from the OTLP translation), verified live against
# otelcol-contrib 0.153.0 / Prometheus v3.12.0.
#
# Naming: <aggregation level>:<metric>:<quantile>_<window>.
#
# Validate:
#   docker run --rm -v $PWD/deploy/prometheus:/r --entrypoint promtool \
#     prom/prometheus:v3.12.0 check rules /r/rules-latency.yaml

groups:
  - name: latency-http
    rules:
      # HTTP server duration by service + chi route pattern (milliseconds).
      - record: job_route:http_server_duration_milliseconds:p50_5m
        expr: histogram_quantile(0.50, sum by (job, http_route) (rate(otel_http_server_duration_milliseconds[5m])))
      - record: job_route:http_server_duration_milliseconds:p95_5m
        expr: histogram_quantile(0.95, sum by (job, http_route) (rate(otel_http_server_duration_milliseconds[5m])))
      - record: job_route:http_server_duration_milliseconds:p99_5m
        expr: histogram_quantile(0.99, sum by (job, http_route) (rate(otel_http_server_duration_milliseconds[5m])))

  - name: latency-cqrs
    rules:
      # CQRS handler duration by service + handler name (milliseconds).
      - record: job_handler:cqrs_handler_duration_milliseconds:p50_5m
        expr: histogram_quantile(0.50, sum by (job, handler) (rate(otel_cqrs_handler_duration_ms_milliseconds[5m])))
      - record: job_handler:cqrs_handler_duration_milliseconds:p95_5m
        expr: histogram_quantile(0.95, sum by (job, handler) (rate(otel_cqrs_handler_duration_ms_milliseconds[5m])))
      - record: job_handler:cqrs_handler_duration_milliseconds:p99_5m
        expr: histogram_quantile(0.99, sum by (job, handler) (rate(otel_cqrs_handler_duration_ms_milliseconds[5m])))

  - name: latency-kafka
    rules:
      # Consumer handler duration by service + topic (seconds) — lane-B
      # instrument (kafka.consumer.handler.duration); empty until it ships.
      - record: job_topic:kafka_consumer_handler_duration_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (job, topic) (rate(otel_kafka_consumer_handler_duration_seconds[5m])))
      - record: job_topic:kafka_consumer_handler_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (job, topic) (rate(otel_kafka_consumer_handler_duration_seconds[5m])))
      - record: job_topic:kafka_consumer_handler_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (job, topic) (rate(otel_kafka_consumer_handler_duration_seconds[5m])))
      # Producer publish round-trip by service + topic (seconds) — lane-B.
      - record: job_topic:kafka_producer_publish_duration_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (job, topic) (rate(otel_kafka_producer_publish_duration_seconds[5m])))
      - record: job_topic:kafka_producer_publish_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (job, topic) (rate(otel_kafka_producer_publish_duration_seconds[5m])))
      - record: job_topic:kafka_producer_publish_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (job, topic) (rate(otel_kafka_producer_publish_duration_seconds[5m])))

  - name: latency-outbox
    rules:
      # Outbox end-to-end publish lag: row created_at → Kafka publish
      # (seconds) — lane-B instrument (outbox.publish_lag).
      - record: job:outbox_publish_lag_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (job) (rate(otel_outbox_publish_lag_seconds[5m])))
      - record: job:outbox_publish_lag_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (job) (rate(otel_outbox_publish_lag_seconds[5m])))
      - record: job:outbox_publish_lag_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (job) (rate(otel_outbox_publish_lag_seconds[5m])))

  - name: latency-pg
    rules:
      # Postgres query duration by service + sqlc query name + pool
      # (seconds) — lane-B instrument (pg.query.duration).
      - record: job_query:pg_query_duration_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (job, query, pool) (rate(otel_pg_query_duration_seconds[5m])))
      - record: job_query:pg_query_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (job, query, pool) (rate(otel_pg_query_duration_seconds[5m])))
      - record: job_query:pg_query_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (job, query, pool) (rate(otel_pg_query_duration_seconds[5m])))

  - name: latency-lifecycle
    rules:
      # Business choreography: order created → terminal status (seconds) —
      # lane-B instrument (orders.lifecycle.duration).
      - record: terminal_status:orders_lifecycle_duration_seconds:p50_5m
        expr: histogram_quantile(0.50, sum by (terminal_status) (rate(otel_orders_lifecycle_duration_seconds[5m])))
      - record: terminal_status:orders_lifecycle_duration_seconds:p95_5m
        expr: histogram_quantile(0.95, sum by (terminal_status) (rate(otel_orders_lifecycle_duration_seconds[5m])))
      - record: terminal_status:orders_lifecycle_duration_seconds:p99_5m
        expr: histogram_quantile(0.99, sum by (terminal_status) (rate(otel_orders_lifecycle_duration_seconds[5m])))

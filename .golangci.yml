version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - bodyclose
    - errorlint
    # SP9 T2: expanded linter set
    - gosec
    - gocritic
    - misspell
    - unconvert
    - prealloc
    - perfsprint
    - errname
    - nilerr
    - nilnil
    - wastedassign
    - usestdlibvars
    - copyloopvar
    # B1/A3: forbid stray debug prints in library + service code. The slog
    # logger (platform/observability/log) is the only sanctioned output sink;
    # genuine stdout CLIs live under cmd/ and are excluded below.
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use the slog logger (platform/observability/log) instead of fmt.Print*; cmd/ CLIs are exempt
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - paramTypeCombine
        - whyNoLint
        - hugeParam
        - rangeValCopy
        - commentedOutCode
        - unnamedResult
        - commentFormatting
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - forbidigo
      - path: platform/testkit/
        linters:
          - gosec
      # cmd/ binaries are user-facing CLIs whose stdout IS the contract.
      - path: cmd/
        linters:
          - forbidigo

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: go-boilerplate
    goimports:
      local-prefixes:
        - go-boilerplate

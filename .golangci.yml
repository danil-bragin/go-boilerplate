run:
  timeout: 5m
  go: "1.25"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - revive
    - bodyclose
    - contextcheck
    - errorlint
    - noctx

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

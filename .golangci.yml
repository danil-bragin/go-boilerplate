version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - bodyclose
    - errorlint
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: go-boilerplate
    goimports:
      local-prefixes:
        - go-boilerplate

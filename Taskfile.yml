version: "3"

tasks:

  # ── Go development ──────────────────────────────────────────────────────────

  tidy:
    desc: Sync go.mod/go.sum
    cmds:
      - go mod tidy

  test:
    desc: Run all tests with race detector (requires Docker for testcontainers)
    cmds:
      - go test -race ./...

  test:unit:
    desc: "Fast lane: unit + functional tests only (-short, no Docker)"
    cmds:
      - go test -short ./...

  test:integration:
    desc: "Full lane: all tests including integration (requires Docker)"
    cmds:
      - go test ./...

  test:e2e:
    desc: Run end-to-end tests only (requires full stack via docker compose)
    cmds:
      - go test ./examples/e2e/...

  test:cover:
    desc: "Fast lane with coverage: outputs summary line to stdout"
    cmds:
      - go test -short -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  gen:mocks:
    desc: Regenerate moq mocks for platform interfaces
    cmds:
      - go generate ./platform/testkit/mocks/...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  build:
    desc: Build the skeleton binary
    cmds:
      - go build -o bin/skeleton ./cmd/skeleton

  run:
    desc: Run the skeleton service
    cmds:
      - go run ./cmd/skeleton

  # ── Code generation ─────────────────────────────────────────────────────────

  buf:
    desc: Lint and generate protobuf/grpc code via buf
    cmds:
      - buf lint
      - buf generate

  sqlc:
    desc: Generate SQL query code for all services and platform packages
    cmds:
      - sqlc generate -f examples/gateway/internal/store/sqlc.yaml
      - sqlc generate -f examples/orders/internal/store/sqlc.yaml
      - sqlc generate -f examples/payments/internal/store/sqlc.yaml
      - sqlc generate -f platform/outbox/sqlc.yaml

  # ── Docker Compose stack ────────────────────────────────────────────────────

  up:
    desc: "Start core infra (pg, kafka, redis, minio, keycloak)"
    cmds:
      - docker compose up -d

  up:obs:
    desc: "Core + observability stack (otel-collector, jaeger, prometheus, grafana, pyroscope)"
    cmds:
      - docker compose --profile observability up -d

  up:apps:
    desc: "Core + the 4 app services (gateway, orders, payments, notifications)"
    cmds:
      - docker compose --profile apps up -d --build

  up:full:
    desc: "Everything: core + observability + apps"
    cmds:
      - docker compose --profile observability --profile apps up -d --build

  down:
    desc: "Stop everything and remove volumes"
    cmds:
      - docker compose --profile observability --profile apps down -v

  logs:
    desc: Stream logs from all services
    cmds:
      - docker compose --profile observability --profile apps logs -f

  ps:
    desc: Show running compose services
    cmds:
      - docker compose ps

  # Usage: curl -H "Authorization: Bearer $(task token)" http://localhost:8080/orders/<id>
  # Keycloak is published on host port 8180 (mapped from container port 8080).
  token:
    desc: "Fetch a Keycloak access token (demo/demo) for manual API calls. Requires jq."
    cmds:
      - 'curl -s -d client_id=gateway -d username=demo -d password=demo -d grant_type=password http://localhost:8180/realms/app/protocol/openid-connect/token | jq -r .access_token'

  # ── Image builds ────────────────────────────────────────────────────────────

  build-images:
    desc: Build Docker images for all four application services
    cmds:
      - docker build --build-arg SERVICE=gateway      -t go-boilerplate/gateway:local      .
      - docker build --build-arg SERVICE=orders       -t go-boilerplate/orders:local       .
      - docker build --build-arg SERVICE=payments     -t go-boilerplate/payments:local     .
      - docker build --build-arg SERVICE=notifications -t go-boilerplate/notifications:local .

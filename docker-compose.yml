# =============================================================================
# DEMO ONLY — all credentials in this file are insecure defaults.
# NEVER use these values in production.
#
# Production secret management:
#   • Use Docker Swarm secrets, Kubernetes Secrets (prefer sealed-secrets or
#     external-secrets-operator), HashiCorp Vault, or a cloud secret manager
#     (AWS Secrets Manager, GCP Secret Manager, Azure Key Vault).
#   • Mount secrets as files (not env vars) and read them at startup via the
#     <NAME>_FILE convention built into platform/config.Load, e.g.:
#
#       PG_DSN_FILE=/run/secrets/pg_dsn   (container mounts the secret here)
#
#     When PG_DSN is unset and PG_DSN_FILE is set, config.Load reads the file
#     (trailing newline trimmed) into the config.Secret field, keeping the raw
#     credential out of the process env. See docs/operations.md §Secrets sourcing.
#
#   • Never commit .env files, credentials, or private keys to version control.
#   • Rotate all default passwords before any production deployment.
#
# TLS note: All inter-service connections in this file are plaintext
# (HTTP, OTLP WithInsecure, sslmode=disable, Kafka PLAINTEXT). In production
# TLS should terminate at the ingress layer or service mesh (Istio, Linkerd,
# AWS ALB, GCP HTTPS LB). See docs/ARCHITECTURE.md "Deferred" section.
# =============================================================================

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    # postgres:16-alpine (digest-pinned — bump via Renovate/Dependabot docker lane).
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # PgBouncer in front of postgres — OPT-IN via the "pgbouncer" profile:
  #   docker compose --profile pgbouncer up -d postgres pgbouncer
  # Transaction pooling: N app replicas × PG_MAX_CONNS client conns collapse
  # into DEFAULT_POOL_SIZE server conns per (db,user) — the remedy for the
  # max_connections=100 wall at ~4 replicas of 25-conn pools.
  # No DB_NAME → the entrypoint writes a wildcard [databases] entry, so all
  # four service DBs (gateway/orders/payments/notifications) route through.
  # Point services at port 6432 and set:
  #   PG_STATEMENT_CACHE_MODE=1  (pgx describe-exec — prepared-statement plans
  #                               don't survive transaction pooling)
  #   PG_MIGRATE_URL=<direct postgres:5432 DSN>  (REQUIRED: migrations hold a
  #     session advisory lock — see docs/operations.md § Migration strategies)
  # See the commented example block in .env.example.
  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    restart: unless-stopped
    profiles: ["pgbouncer"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      # Dev creds matching deploy/postgres/init.sql; AUTH_TYPE=plain keeps the
      # demo simple while PgBouncer still speaks SCRAM upstream to postgres.
      DB_USER: app
      DB_PASSWORD: app
      AUTH_TYPE: plain
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "500"
      DEFAULT_POOL_SIZE: "20"
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redpanda:
    # v25.3.15 (digest-pinned).
    image: redpandadata/redpanda:v25.3.15@sha256:2c77434b8c7a13016f0d936563fa3a8725aaaac7cd31e9be0ad7d1eb9cd6cb76
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"   # external Kafka access from host
      - "8081:8081"     # Schema Registry
      - "8082:8082"     # Pandaproxy (optional)
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  redpanda-console:
    # v3.7.4 (digest-pinned). Console v3 config schema change: schemaRegistry
    # is now a TOP-LEVEL stanza (was nested under kafka in v2). See
    # https://docs.redpanda.com/current/migrate/console-v3/
    image: redpandadata/console:v3.7.4@sha256:72bd99bdc304a7c6aab58bfaccf92e302d4e826f6f4737d14953eb04ceed7c07
    restart: unless-stopped
    # Canonical Redpanda pattern: the image ENTRYPOINT is ./console, so a bare
    # `command: sh -c …` is passed to console as argv (never executed) — the
    # entrypoint override is required for the config-file write to actually run.
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; exec /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
    ports:
      - "8090:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  redis:
    # redis:7-alpine (digest-pinned). --requirepass enables auth (round-8
    # hardening). Dev cred "redis" — the gateway reads it via REDIS_PASSWORD
    # (lane A's cache.Config.Password / extra rueidis clients). Override or use
    # the _FILE convention in any non-throwaway setup.
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "redis"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # -a authenticates the probe against the requirepass above.
      test: ["CMD", "redis-cli", "-a", "redis", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # SeaweedFS all-in-one (master + volume + filer + S3 gateway) — local
  # S3-compatible object store. Static credentials live in
  # deploy/seaweedfs/s3.json (ADR-0012: MinIO OSS archived).
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
    volumes:
      - seaweedfs-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # Port-listening check; the setup job below retries until the filer
      # behind the S3 gateway actually serves requests.
      # 127.0.0.1 (not localhost): the image resolves localhost to ::1 first,
      # but the S3 gateway listens on IPv4 only.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  seaweedfs-setup:
    image: amazon/aws-cli:2.22.35
    restart: on-failure
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: seaweedadmin
      AWS_SECRET_ACCESS_KEY: seaweedadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      sh -c "
        until aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket app 2>/dev/null ||
              aws --endpoint-url http://seaweedfs:8333 s3api create-bucket --bucket app; do
          echo 'waiting for seaweedfs S3 gateway...'; sleep 2;
        done &&
        echo 'SeaweedFS bucket ready.'
      "

  keycloak:
    # 26.6.3 (digest-pinned). KC 26 ships hostname v2 and requires http to be
    # explicitly enabled for the dev http listener (start-dev enables it, but we
    # also set KC_HTTP_ENABLED=true so a future `start` swap keeps working).
    image: quay.io/keycloak/keycloak:26.6.3@sha256:5fdbf2dbb5897cc34e82de49d13e23db011f9925089dbc555fc095f2c8bc1dac
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-mem
      KC_HEALTH_ENABLED: "true"
      # KC 26 hostname v2: enable the plain-HTTP listener for the dev stack
      # (TLS terminates at ingress in production — see the header banner).
      KC_HTTP_ENABLED: "true"
      # Pin the issuer to the host-facing URL. Without this, tokens minted via
      # localhost:8180 carry iss=http://localhost:8180/… while the gateway
      # expects the in-network issuer — every host-fetched token (just token,
      # the README curl flow, just demo) fails verification with 401.
      # The gateway's GATEWAY_JWKS_ISSUER matches this value; JWKS keys are
      # still fetched over the internal DNS name (GATEWAY_JWKS_URL).
      # KC 26 hostname v2 accepts the full origin URL here (unchanged from KC 25).
      KC_HOSTNAME: http://localhost:8180
    command: ["start-dev", "--import-realm"]
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8180:8080"   # offset to avoid conflict with gateway
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Observability ───────────────────────────────────────────────────────────

  otel-collector:
    # ≥0.153 required: the prometheusexporter converts OTLP exponential
    # histograms to Prometheus NATIVE histograms (0.111 silently dropped the
    # native representation). Verified live — see docs/operations.md §Latency tails.
    image: otel/opentelemetry-collector-contrib:0.153.0
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus exporter
      - "13133:13133" # health_check extension (curl -f http://localhost:13133/)
    depends_on:
      - jaeger
    # NOTE: no compose healthcheck — the contrib image is DISTROLESS (no
    # shell/wget/curl), so an in-container probe cannot execute; the previous
    # wget healthcheck could only ever report unhealthy. Liveness is served
    # by the health_check extension on :13133 (deploy/otel-collector.yaml),
    # published above for host-side / orchestrator probes.

  jaeger:
    # Jaeger v2 (2.19.0, digest-pinned). v2 is OpenTelemetry-Collector-based and
    # OTLP-native: it accepts OTLP on 4317/4318 directly out of the box, so the
    # v1-only COLLECTOR_OTLP_ENABLED env is gone. The default all-in-one config
    # (memory storage + OTLP receivers + UI) needs no config file. The otel
    # collector still exports OTLP gRPC to jaeger:4317 (deploy/otel-collector.yaml).
    image: jaegertracing/jaeger:2.19.0@sha256:ede4864215be4cd85bd8c3129a2fea6c5713c5653c7282c429dba123014bc68b
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "16686:16686"  # Jaeger UI
      - "14317:4317"   # OTLP gRPC (host-mapped to avoid conflict with collector)

  prometheus:
    # v3.x required for native-histogram ingestion (stable since v3.9; scraping
    # is enabled via `scrape_native_histograms: true` in deploy/prometheus.yml,
    # the v2-era --enable-feature=native-histograms flag is a no-op now).
    # NOTE: the v3 image no longer ships console templates — the v2
    # --web.console.* flags would fail startup and were removed.
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
      - ./deploy/prometheus/rules-latency.yaml:/etc/prometheus/rules-latency.yaml:ro
      - ./deploy/prometheus/slo.yaml:/etc/prometheus/slo.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  grafana:
    # 12.3.7 (digest-pinned). Anonymous auth DISABLED — log in with the dev
    # admin credentials below (admin / admin; change GF_SECURITY_ADMIN_PASSWORD
    # or mount GF_SECURITY_ADMIN_PASSWORD__FILE in any non-throwaway setup).
    image: grafana/grafana:12.3.7@sha256:f02eb8dfe2cd57c1d4cdfaa18394403e2df31e3150efc0fcd7981567958f8364
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # DEMO credential — override via env or the _FILE convention in real use:
      #   GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Anonymous access disabled (round-8 hardening): the dashboards are no
      # longer world-readable; authenticate as admin.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-pyroscope-app
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

  pyroscope:
    # 1.8.0, not 1.8.1: the 1.8.1 tag does not exist on Docker Hub — pulling
    # it fails the whole observability profile (caught by `just demo`).
    image: grafana/pyroscope:1.8.0
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "4040:4040"

  # ── Application Services ────────────────────────────────────────────────────

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: gateway
    restart: unless-stopped
    profiles: ["apps"]
    # Container hardening (round-8): the distroless app logs to stdout and writes
    # nothing to disk, so a read-only rootfs is safe. tmpfs /tmp covers any
    # transient scratch (e.g. Go's os.TempDir); cap_drop ALL + no-new-privileges
    # shrink the blast radius of a compromised process.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    # Runtime resource limits — tune per workload in production.
    # Prefer whole-number CPU limits (1.0, 2.0) to avoid CFS throttling artifacts.
    # GOMEMLIMIT should be ~90% of mem_limit so the GC targets soft-trim before
    # the cgroup OOM-killer fires. See docs/operations.md for rationale.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      # Postgres
      PG_DSN: postgres://app:app@postgres:5432/gateway?sslmode=disable
      # Kafka
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: gateway
      # HTTP
      HTTP_ADDR: :8080
      # Telemetry
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_ENABLED: "true"
      # Logging
      LOG_LEVEL: info
      LOG_FORMAT: json
      # Auth — enabled by default; Keycloak is the IdP.
      # To disable for local dev without Keycloak: set GATEWAY_AUTH_DISABLED=true.
      GATEWAY_AUTH_DISABLED: "false"
      GATEWAY_JWKS_URL: http://keycloak:8080/realms/app/protocol/openid-connect/certs
      # The JWKS URL above is plaintext http (internal-only dev Keycloak). The
      # verifier refuses a non-https JWKS URL unless this opt-in is set — DEV
      # ONLY. In production point GATEWAY_JWKS_URL at https and drop this line
      # (an http JWKS can be MITM-swapped to forge tokens).
      AUTH_ALLOW_INSECURE_JWKS: "true"
      # Must equal the iss claim Keycloak mints — pinned host-facing via
      # KC_HOSTNAME on the keycloak service (NOT the internal DNS name).
      GATEWAY_JWKS_ISSUER: http://localhost:8180/realms/app
      GATEWAY_JWKS_AUDIENCE: gateway
      # Topics
      ORDERS_COMMANDS_TOPIC: orders.commands
      ORDERS_EVENTS_TOPIC: orders.events
      PAYMENTS_EVENTS_TOPIC: payments.events
      # Rate limiting (per-IP tier + authed per-principal tier). Adjust for
      # your traffic profile; RATELIMIT_AUTHED_RPS=0 disables the authed tier.
      # RATELIMIT_REDIS=true uses Redis-backed distributed limiters (requires REDIS_ADDRS).
      # TRUSTED_PROXIES: comma-separated CIDRs for trusted reverse proxies (e.g. "10.0.0.0/8").
      RATELIMIT_RPS: "50"
      RATELIMIT_BURST: "100"
      RATELIMIT_AUTHED_RPS: "200"
      RATELIMIT_AUTHED_BURST: "400"
      RATELIMIT_REDIS: "false"
      # Redis auth: matches the redis service --requirepass. Consumed by lane A's
      # cache.Config.Password (and the ratelimit/sse rueidis clients) once merged;
      # harmless until then (RATELIMIT_REDIS=false means redis is not dialed here).
      # REDIS_ADDRS: "redis:6379"
      REDIS_PASSWORD: redis
      # TRUSTED_PROXIES: ""
      # Go runtime memory limit: ~90% of the container memory limit above.
      # Keeps the GC soft-trim target below the cgroup hard limit, preventing OOM-kill.
      GOMEMLIMIT: 460MiB
    # In-image static probe (cmd/probe, baked into the distroless image):
    # GET http://127.0.0.1:<port>/livez where <port> comes from ADMIN_HTTP_ADDR
    # (unset here → servicekit default :9090). The Dockerfile declares the same
    # HEALTHCHECK; this block repeats it so compose-level tuning (start_period)
    # is explicit and visible next to depends_on consumers.
    healthcheck:
      test: ["CMD", "/probe"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  orders:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: orders
    restart: unless-stopped
    profiles: ["apps"]
    # Container hardening (round-8) — see the gateway service for rationale.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Runtime resource limits — tune per workload in production.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      # Postgres
      PG_DSN: postgres://app:app@postgres:5432/orders?sslmode=disable
      # Kafka
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: orders
      # Telemetry
      OTEL_SERVICE_NAME: orders
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_ENABLED: "true"
      # Logging
      LOG_LEVEL: info
      LOG_FORMAT: json
      # Topics
      ORDERS_COMMANDS_TOPIC: orders.commands
      # Go runtime memory limit: ~90% of the container memory limit above.
      GOMEMLIMIT: 460MiB
    # In-image static probe (cmd/probe) → admin /livez; see the gateway block.
    healthcheck:
      test: ["CMD", "/probe"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  payments:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payments
    restart: unless-stopped
    profiles: ["apps"]
    # Container hardening (round-8) — see the gateway service for rationale.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Runtime resource limits — tune per workload in production.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      # Postgres
      PG_DSN: postgres://app:app@postgres:5432/payments?sslmode=disable
      # Kafka
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: payments
      # Telemetry
      OTEL_SERVICE_NAME: payments
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_ENABLED: "true"
      # Logging
      LOG_LEVEL: info
      LOG_FORMAT: json
      # Topics
      ORDERS_EVENTS_TOPIC: orders.events
      # Go runtime memory limit: ~90% of the container memory limit above.
      GOMEMLIMIT: 460MiB
    # In-image static probe (cmd/probe) → admin /livez; see the gateway block.
    healthcheck:
      test: ["CMD", "/probe"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notifications
    restart: unless-stopped
    profiles: ["apps"]
    # Container hardening (round-8) — see the gateway service for rationale.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Runtime resource limits — tune per workload in production.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    environment:
      # Postgres
      PG_DSN: postgres://app:app@postgres:5432/notifications?sslmode=disable
      # Kafka
      KAFKA_BROKERS: redpanda:9092
      KAFKA_CLIENT_ID: notifications
      # Telemetry
      OTEL_SERVICE_NAME: notifications
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_ENABLED: "true"
      # Logging
      LOG_LEVEL: info
      LOG_FORMAT: json
      # Topics
      PAYMENTS_EVENTS_TOPIC: payments.events
      # Go runtime memory limit: ~90% of the container memory limit above.
      GOMEMLIMIT: 460MiB
    # In-image static probe (cmd/probe) → admin /livez; see the gateway block.
    healthcheck:
      test: ["CMD", "/probe"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy

volumes:
  postgres-data:
  redpanda-data:
  redis-data:
  seaweedfs-data:
  prometheus-data:
  grafana-data:
